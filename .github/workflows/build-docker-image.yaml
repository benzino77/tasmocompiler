name: Build Docker Image
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        type: choice
        default: 'master'
        options:
          - 'master'
          - 'development'
  release:
    types: [published]
  push:
    branches:
      - 'development'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUILD_BRANCH: ${{ github.event_name == 'release' && 'master' || github.event_name == 'push' && 'development' || inputs.branch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.BUILD_BRANCH }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Load Buildx
        run: docker buildx create --name mybuilder --use
        if: runner.os == 'Linux'

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Log into registry ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from package.json
        if: ${{ env.BUILD_BRANCH == 'master' }}
        run: echo "DOCKER_TAG=$(jq -r '.version' package.json)" >> $GITHUB_ENV

      - name: Extract Docker metadata (master)
        if: ${{ env.BUILD_BRANCH == 'master' }}
        id: meta_m
        uses: docker/metadata-action@v6
        with:
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.DOCKER_TAG }}
          images: |
            ${{ github.repository }}
            ghcr.io/${{ github.repository }}

      - name: Extract Docker metadata (development)
        if: ${{ env.BUILD_BRANCH == 'development' }}
        id: meta_d
        uses: docker/metadata-action@v6
        with:
          tags: |
            type=raw,value=development
          images: |
            ${{ github.repository }}
            ghcr.io/${{ github.repository }}

      - name: Build and push production Docker image (master)
        if: ${{ env.BUILD_BRANCH == 'master' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta_m.outputs.tags }}
          labels: ${{ steps.meta_m.outputs.labels }}

      - name: Build and push production Docker image (development)
        if: ${{ env.BUILD_BRANCH == 'development' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta_d.outputs.tags }}
          labels: ${{ steps.meta_d.outputs.labels }}
